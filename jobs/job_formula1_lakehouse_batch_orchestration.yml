resources:
  jobs:
    Job_formula1_incremental_batch_orchestration:
      name: Job_formula1_incremental_batch_orchestration
      tasks:
        - task_key: 01_Identify_Next_Batch
          notebook_task:
            notebook_path: /Workspace/Users/<your-user>/Databricks-course/formula1_project_incremental_loads/06-orchestration/01.Identify
              Next Batch
            source: WORKSPACE
          existing_cluster_id: 0917-222422-l8v0sgws
        - task_key: Is_There_A_Batch_To_Process
          depends_on:
            - task_key: 01_Identify_Next_Batch
          condition_task:
            op: EQUAL_TO
            left: "{{tasks.01_Identify_Next_Batch.values.has_batch}}"
            right: "true"
        - task_key: 02_Create_New_Batch
          depends_on:
            - task_key: Is_There_A_Batch_To_Process
              outcome: "true"
          notebook_task:
            notebook_path: /Workspace/Users/<your-user>/Databricks-course/formula1_project_incremental_loads/06-orchestration/02.Create
              New Batch
            base_parameters:
              p_batch_id: "{{tasks.01_Identify_Next_Batch.values.p_batch_id}}"
            source: WORKSPACE
          existing_cluster_id: 0917-222422-l8v0sgws
        - task_key: run_job_formula1_lakehouse_incremental_full_refresh
          depends_on:
            - task_key: 02_Create_New_Batch
          run_job_task:
            job_id: 100107183813424
            job_parameters:
              p_batch_id: "{{tasks.01_Identify_Next_Batch.values.p_batch_id}}"
        - task_key: 03_Complete_Batch
          depends_on:
            - task_key: run_job_formula1_lakehouse_incremental_full_refresh
          notebook_task:
            notebook_path: /Workspace/Users/<your-user>/Databricks-course/formula1_project_incremental_loads/06-orchestration/03.Complete
              Batch
            base_parameters:
              p_batch_id: "{{tasks.01_Identify_Next_Batch.values.p_batch_id}}"
            source: WORKSPACE
          existing_cluster_id: 0917-222422-l8v0sgws
      queue:
        enabled: true
